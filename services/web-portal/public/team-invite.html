<!doctype html><html data-ny-page="team-invite.html" lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Nyrava Home | Accept team invitation</title><link rel="stylesheet" href="/team.css?v=20261019-theme-1"><link rel="stylesheet" href="/design-20261019/theme.css?v=20261019-theme-1" data-nyrava-theme="20261019-theme-1"><link rel="stylesheet" href="/site-navigation.css?v=1"><script defer src="/site-navigation.js?v=1"></script><link rel="stylesheet" href="/password-controls.css?v=1"><script defer src="/password-controls.js?v=1"></script></head><body><header><strong>Nyrava Home · Employee invitation</strong></header><main><section><h1>Join your business team</h1><p>Create a password of 12–128 characters. If you already have an employee account, enter your current password. Subscriber and administrator accounts cannot be converted to employee accounts.</p><p id="message" role="status"></p><form id="accept"><label>Password<input id="password" type="password" minlength="12" maxlength="128" required autocomplete="new-password"></label><button id="submit">Accept invitation</button></form><p><a href="/nyrava-signin.html?role=employee">Sign in to your employee account</a></p></section></main><script src="/team-common.js?v=20261019-theme-1"></script><script>
const token=location.hash.slice(1);history.replaceState(null,'',location.pathname);
if(!token){message('Open the complete invitation link provided by your business owner.');document.querySelector('#submit').disabled=true}
document.querySelector('#accept').onsubmit=e=>{e.preventDefault();run(async()=>{const b=document.querySelector('#submit');b.disabled=true;try{await post('/api/team/accept',{token,password:document.querySelector('#password').value});document.querySelector('#accept').hidden=true;message('Your employee account is ready. Select Sign in to your employee account below, using the invited email and the password you just created. You will see only the leads assigned to you by your business owner.')}finally{b.disabled=false}})};
</script></body></html>
