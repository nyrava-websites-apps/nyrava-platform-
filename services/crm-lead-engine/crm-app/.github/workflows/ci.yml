name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: .NET 8 Release build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore NyravaCRM.csproj

      - name: Build Release
        run: dotnet build NyravaCRM.csproj --configuration Release --no-restore

      - name: Run integration tests
        run: dotnet test tests/NyravaCRM.Tests/NyravaCRM.Tests.csproj --configuration Release
