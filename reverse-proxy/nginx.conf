events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # 1. Web Portal
    server {
        listen 80;
        server_name home.nyrava.com preview.nyrava.com localhost;

        location / {
            proxy_pass http://web-portal:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # 2. CRM & Lead Engine
    server {
        listen 80;
        server_name crm.nyrava.com;

        location / {
            proxy_pass http://crm-lead-engine:5180;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # 3. Home Evaluation Engine
    server {
        listen 80;
        server_name value.nyrava.com;

        location / {
            proxy_pass http://home-evaluation:5190;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # 4. Meet & Video Consultation
    server {
        listen 80;
        server_name meet.nyrava.com;

        location / {
            proxy_pass http://meet-consultation:5000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
