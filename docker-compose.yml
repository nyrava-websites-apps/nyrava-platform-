# ===================================================================
# NYRAVA HOME — BLUE PRODUCTION ARCHITECTURE
# Full Containerized Stack: Caddy Edge, PostgreSQL, Redis, NATS Event Bus,
# Coturn STUN/TURN, Prometheus Observability, MinIO Object Storage
# ===================================================================

version: '3.8'

networks:
  nyrava_network:
    name: nyrava-platform_default
    driver: bridge

services:
  # 1. Hardened Caddy Edge Reverse Proxy with TLS, WAF & Rate Limiting
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - PORTAL_DOMAIN=${PORTAL_DOMAIN:-localhost}
      - CRM_DOMAIN=${CRM_DOMAIN:-crm.localhost}
      - VALUATION_DOMAIN=${VALUATION_DOMAIN:-value.localhost}
      - MEET_DOMAIN=${MEET_DOMAIN:-meet.localhost}
    volumes:
      - ./reverse-proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - nyrava_network
    depends_on:
      - web-portal
      - crm-lead-engine
      - home-evaluation
      - meet-consultation

  # 2. Main Public Web Portal (home.nyrava.com)
  web-portal:
    build:
      context: ./services/web-portal
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - CRM_SERVICE_URL=http://crm-lead-engine:5180
      - VALUATION_SERVICE_URL=http://home-evaluation:5190
      - MEET_SERVICE_URL=http://meet-consultation:5000
      - REDIS_URL=redis://:${REDIS_PASSWORD:-NyravaRedisSecure2026!}@redis:6379
    networks:
      - nyrava_network
    depends_on:
      - redis

  # 3. Nyrava CRM & Central Identity Service (crm.nyrava.com)
  crm-lead-engine:
    build:
      context: ./services/crm-lead-engine
    restart: unless-stopped
    ports:
      - "5180:5180"
    volumes:
      - crm_db_data:/app/data
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://0.0.0.0:5180
      - Database__Provider=Sqlite
      - ConnectionStrings__Crm=Data Source=/app/data/nyrava-crm.db
      - ConnectionStrings__PostgreSql=Host=postgres;Port=5432;Database=nyrava_crm;Username=nyrava_admin;Password=${POSTGRES_PASSWORD:-NyravaSecurePg2026!}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-NyravaRedisSecure2026!}
      - SMTP_HOST=${SMTP_HOST:-smtp.zoho.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-notifications@nyrava.com}
      - SMTP_PASS=${SMTP_PASS:-}
      - EMAIL_FROM=${EMAIL_FROM:-Nyrava Home <notifications@nyrava.com>}
      - SMTP_SSL=${SMTP_SSL:-true}
      - Crm__PublicBaseUrl=https://${CRM_DOMAIN:-crm.nyrava.com}
      - JWT_SECRET=${JWT_SECRET:-NyravaHome_Production_JwtSigningKey_Secure_2026_Minimum32Bytes!}
    networks:
      - nyrava_network
    depends_on:
      - postgres
      - redis

  # 4. Property Evaluation & CMA Engine (value.nyrava.com)
  home-evaluation:
    build:
      context: ./services/home-evaluation
    restart: unless-stopped
    ports:
      - "5190:5190"
    environment:
      - PORT=5190
      - CRM_URL=http://crm-lead-engine:5180
      - SMTP_HOST=${SMTP_HOST:-smtp.zoho.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-notifications@nyrava.com}
      - SMTP_PASS=${SMTP_PASS:-}
      - EMAIL_FROM=${EMAIL_FROM:-no-reply@nyrava.com}
    networks:
      - nyrava_network

  # 5. Video Consultation & Nyra Meet (meet.nyrava.com)
  meet-consultation:
    build:
      context: ./services/meet-consultation
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-NyravaRedisSecure2026!}
    networks:
      - nyrava_network
    depends_on:
      - redis

  # 6. PostgreSQL Transactional System of Record
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nyrava_crm}
      POSTGRES_USER: ${POSTGRES_USER:-nyrava_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-NyravaSecurePg2026!}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./data/nyrava_postgres_migration.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - nyrava_network

  # 7. Redis Cache, Sessions & Presence Engine
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-NyravaRedisSecure2026!}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - nyrava_network

  # 8. Durable Asynchronous Event Bus (NATS JetStream)
  event-bus:
    image: nats:2.10-alpine
    restart: unless-stopped
    command: -js -m 8222
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data
    networks:
      - nyrava_network

  # 9. Coturn WebRTC STUN/TURN UDP Relay
  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
    networks:
      - nyrava_network

  # 10. Observability & Telemetry (Prometheus Metrics Scraper)
  observability:
    image: prom/prometheus:v2.51.0
    restart: unless-stopped
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - nyrava_network

  # 11. Object Storage & Backup Target (Scality S3 API Compatible)
  object-storage:
    image: zenko/cloudserver:latest
    restart: unless-stopped
    environment:
      SCALITY_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-nyrava_minio}
      SCALITY_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-NyravaMinioSecret2026!}
      S3BACKEND: mem
    ports:
      - "8000:8000"
    networks:
      - nyrava_network

volumes:
  caddy_data:
  caddy_config:
  crm_db_data:
  pg_data:
  redis_data:
  nats_data:
  prometheus_data:
  minio_data:
